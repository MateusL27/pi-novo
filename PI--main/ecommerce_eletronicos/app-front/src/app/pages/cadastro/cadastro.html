<!-- Tela para criar uma conta de administrador. -->
<main class="pagina-cadastro">
  <section class="cartao-cadastro">
    <h1>Criar conta</h1>
    <p>Preencha seus dados para criar uma conta de administrador.</p>

    <!-- ngForm acompanha os campos; ngSubmit chama cadastrar() ao enviar. -->
    <form #cadastroForm="ngForm" (ngSubmit)="cadastrar()">
      <label for="nome">Nome</label>
      <input id="nome" name="nome" type="text" placeholder="Seu nome" [(ngModel)]="nome" required />

      <label for="email">E-mail</label>
      <input
        id="email"
        name="email"
        type="email"
        placeholder="voce@exemplo.com"
        [(ngModel)]="email"
        required
      />

      <label for="senha">Senha</label>
      <input
        id="senha"
        name="senha"
        type="password"
        placeholder="Crie uma senha"
        [(ngModel)]="senha"
        required
      />

      <!-- O botão fica desativado enquanto envia ou se os campos forem inválidos. -->
      <button type="submit" [disabled]="carregando || !cadastroForm.form.valid">
        {{ carregando ? 'Criando conta...' : 'Criar conta' }}
      </button>

      <!-- Mostra avisos de validação ou erros do cadastro. -->
      @if (mensagem) {
        <p class="erro" role="status">{{ mensagem }}</p>
      }

      <a routerLink="/login">Voltar para o login</a>
    </form>
  </section>
</main>
